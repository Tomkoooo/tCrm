name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Unit tests + Button asChild guard. E2E: local preflight:e2e (see docs/rules.md).
      - name: Test
        run: pnpm test && node scripts/verify-button-aschild.mjs
        env:
          CI: true
          AUTH_SECRET: ci-build-secret-minimum-32-characters-long

      - name: Build
        run: pnpm build
        env:
          AUTH_SECRET: ci-build-secret-minimum-32-characters-long
          MONGODB_URI: mongodb://localhost:27017
