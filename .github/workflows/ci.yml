name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Unit/integration only — E2E (Playwright) runs locally: pnpm test:e2e
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          AUTH_SECRET: ci-build-secret-minimum-32-characters-long
          MONGODB_URI: mongodb://localhost:27017
